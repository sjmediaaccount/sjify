version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: sjify-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: sjify_user
      POSTGRES_PASSWORD: sjify_secure_password
      POSTGRES_DB: sjify_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sjify_user -d sjify_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: sjify-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio:RELEASE.2024-03-30T09-41-56Z
    container_name: sjify-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: sjify_minio_admin
      MINIO_ROOT_PASSWORD: sjify_minio_password
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5

  # MinIO Bucket Auto-Creator
  createbuckets:
    image: minio/mc:latest
    container_name: sjify-minio-buckets
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      /usr/bin/mc alias set local http://minio:9000 sjify_minio_admin sjify_minio_password;
      /usr/bin/mc mb --ignore-existing local/sjify-datasets;
      /usr/bin/mc mb --ignore-existing local/sjify-keyvalue;
      /usr/bin/mc mb --ignore-existing local/sjify-logs;
      /usr/bin/mc mb --ignore-existing local/sjify-builds;
      /usr/bin/mc anonymous set download local/sjify-datasets;
      /usr/bin/mc anonymous set download local/sjify-keyvalue;
      exit 0;
      "

  mailhog:
    image: mailhog/mailhog:latest
    container_name: sjify-mailhog
    restart: unless-stopped
    ports:
      - "1025:1025" # SMTP port
      - "8025:8025" # Web UI port

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  minio_data:
    driver: local
